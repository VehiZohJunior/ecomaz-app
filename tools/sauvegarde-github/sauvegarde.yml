# =====================================================================
# EcoMaZ — Sauvegarde automatique de la base, SANS l'ordinateur du fondateur
# =====================================================================
# À placer dans un dépôt GitHub PRIVÉ : .github/workflows/sauvegarde.yml
# (voir tools/sauvegarde-github/GUIDE.md). Gratuit : GitHub Actions.
# Chaque soir à 19 h (heure d'Abidjan) : copie complète de la base, CHIFFRÉE
# (AES-256) avec une phrase secrète connue du seul fondateur, gardée 30 jours.
# Aucune donnée en clair ne quitte la machine de GitHub : seul le fichier
# chiffré est conservé. Sans la phrase secrète, il est illisible.
# Secrets à créer dans le dépôt (Settings → Secrets and variables → Actions) :
#   ECOMAZ_DB_URL              mot de passe de la base (ou l'adresse complète : les deux marchent)
#   ECOMAZ_PHRASE_SAUVEGARDE   phrase secrète de chiffrement (à écrire aussi sur papier)
# =====================================================================
name: Sauvegarde EcoMaZ

on:
  schedule:
    - cron: '0 19 * * *'   # 19 h 00 à Abidjan (UTC+0), chaque jour
  workflow_dispatch: {}     # bouton « Run workflow » pour lancer à la main

permissions:
  contents: read

jobs:
  sauvegarde:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Copie chiffrée de la base
        env:
          ECOMAZ_DB_URL: ${{ secrets.ECOMAZ_DB_URL }}
          ECOMAZ_PHRASE: ${{ secrets.ECOMAZ_PHRASE_SAUVEGARDE }}
        run: |
          set -euo pipefail
          if [ -z "${ECOMAZ_DB_URL}" ] || [ -z "${ECOMAZ_PHRASE}" ]; then echo "::error::Secrets manquants (voir GUIDE.md)"; exit 1; fi
          # Le secret ECOMAZ_DB_URL peut contenir l'adresse complète OU le mot de passe seul :
          # on en extrait le mot de passe, puis on reconstruit nous-mêmes une adresse correcte.
          V=$(printf '%s' "${ECOMAZ_DB_URL}" | tr -d '\r\n\t' | sed -e 's/^ *//' -e 's/ *$//')
          HOTE_DONNE=""
          case "$V" in
            postgresql://*|postgres://*)
              RESTE="${V#*://}"; INFOS="${RESTE%@*}"; APRES="${RESTE##*@}"
              MDP="${INFOS#*:}"; HOTE_DONNE="${APRES%%[:/?]*}";;
            *) MDP="$V";;
          esac
          MDP="${MDP#[}"; MDP="${MDP%]}"
          if [ -z "$MDP" ] || [ "$MDP" = "YOUR-PASSWORD" ]; then echo "::error::Le secret ECOMAZ_DB_URL ne contient pas le mot de passe de la base. Collez SEULEMENT le mot de passe de la base (Supabase → Database → Settings)."; exit 1; fi
          echo "::add-mask::$MDP"
          MDP_ENC=$(MDP="$MDP" python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["MDP"],safe=""))')
          echo "::add-mask::$MDP_ENC"
          REF=hvqtsvpkxffseclsfoun
          HOTES="$HOTE_DONNE aws-0-eu-west-1.pooler.supabase.com aws-1-eu-west-1.pooler.supabase.com aws-0-eu-west-2.pooler.supabase.com aws-1-eu-west-2.pooler.supabase.com aws-0-eu-central-1.pooler.supabase.com aws-1-eu-central-1.pooler.supabase.com aws-0-eu-west-3.pooler.supabase.com aws-1-eu-west-3.pooler.supabase.com"
          docker pull -q postgres:17 >/dev/null
          PGURL=""; MDP_REFUSE=0
          for H in $HOTES; do
            case "$H" in *pooler.supabase.com) ;; *) continue;; esac
            ESSAI="postgresql://postgres.${REF}:${MDP_ENC}@${H}:5432/postgres?sslmode=require"
            if SORTIE=$(docker run --rm -e PGURL="$ESSAI" postgres:17 psql "$ESSAI" -tAc 'select 1' 2>&1); then
              PGURL="$ESSAI"; echo "Connexion réussie au serveur ${H}"; break
            fi
            case "$SORTIE" in
              *"password authentication failed"*) MDP_REFUSE=1; echo "Serveur ${H} : mot de passe refusé"; break;;
              *) echo "Serveur ${H} : pas le bon";;
            esac
          done
          if [ -z "$PGURL" ]; then
            if [ "$MDP_REFUSE" = 1 ]; then echo "::error::Le serveur a été trouvé mais le MOT DE PASSE est refusé : dans Supabase, régénérez le mot de passe de la base (Reset database password → Generate), copiez-le, et collez-le SEUL dans le secret ECOMAZ_DB_URL."; else echo "::error::Aucun serveur Supabase n'a reconnu le projet. Prévenez Claude."; fi
            exit 1
          fi
          export PGURL
          JOUR=$(date -u +%Y-%m-%d)
          mkdir -p sortie
          # Données de l'école (schéma public) : OBLIGATOIRE
          docker run --rm -e PGURL="${PGURL}" postgres:17 \
            sh -c 'pg_dump "$PGURL" --schema=public --no-owner --no-privileges -Fc' > sortie/public.dump
          # Comptes de connexion (schéma auth) : utile pour une restauration complète, sans bloquer si refusé
          docker run --rm -e PGURL="${PGURL}" postgres:17 \
            sh -c 'pg_dump "$PGURL" --schema=auth --data-only --no-owner --no-privileges -Fc' > sortie/auth.dump || { echo "::warning::Schéma auth non copié"; rm -f sortie/auth.dump; }
          TAILLE=$(stat -c%s sortie/public.dump)
          echo "Taille de la copie (avant chiffrement) : ${TAILLE} octets"
          if [ "${TAILLE}" -lt 50000 ]; then echo "::error::Copie anormalement petite"; exit 1; fi
          tar -C sortie -cf - . | gpg --batch --yes --pinentry-mode loopback --passphrase "${ECOMAZ_PHRASE}" \
            --symmetric --cipher-algo AES256 -o "ecomaz-${JOUR}.tar.gpg"
          rm -rf sortie
          ls -la ecomaz-*.tar.gpg
      - name: Conservation 30 jours (privée)
        uses: actions/upload-artifact@v4
        with:
          name: ecomaz-sauvegarde-${{ github.run_number }}
          path: ecomaz-*.tar.gpg
          retention-days: 30
          if-no-files-found: error
