<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pointage — EcoMaZ</title>
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ecomaz-tokens.css">
<link rel="stylesheet" href="theme.css">
<script src="theme.min.js"></script>
<link rel="stylesheet" href="ecomaz-motion.css">
<style>
  /* Pointage enseignant par lien SMS — spécification § 5.4 (registre « vivant mesuré ») */
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{ background:var(--em-bg); color:var(--em-text); font-family:var(--em-font);
    display:flex; align-items:center; justify-content:center; padding:20px; min-height:100%; }
  .carte{ background:var(--em-surface); border:1px solid var(--em-border); border-radius:var(--em-radius-xl); box-shadow:var(--em-shadow-md);
    padding:28px 22px 24px; max-width:420px; width:100%; text-align:center; display:flex; flex-direction:column; align-items:center; gap:14px; overflow:hidden; }
  .marque{ display:flex; align-items:center; gap:10px; align-self:flex-start; }
  .marque-logo{ width:38px; height:38px; border-radius:12px; background:var(--em-green-700); color:#fff; font-weight:900; font-size:18px; display:flex; align-items:center; justify-content:center; }
  .marque-txt{ font-size:var(--em-fs-12); font-weight:800; letter-spacing:.04em; text-transform:uppercase; color:var(--em-text-muted); text-align:left; }
  h1{ font-size:var(--em-fs-20); font-weight:900; margin:4px 0 0; }
  .sub{ color:var(--em-text-muted); font-size:var(--em-fs-14); line-height:1.5; margin:0; }
  /* Grand bouton circulaire 160 px, anneau qui pulse doucement tant que non pointé */
  .rond{ position:relative; width:160px; height:160px; border-radius:50%; border:none; cursor:pointer; margin:8px 0;
    background:var(--em-green-700); color:#fff; font:900 var(--em-fs-15)/1.25 var(--em-font); padding:18px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; }
  .rond svg{ width:34px; height:34px; }
  .rond::before{ content:''; position:absolute; inset:-8px; border-radius:50%; border:3px solid var(--em-green-500); opacity:.6;
    animation:em-ring 2.2s var(--em-ease-out) infinite; pointer-events:none; }
  .rond:disabled{ cursor:default; }
  .rond:disabled::before{ animation:none; opacity:0; }
  .rond:focus-visible{ outline:3px solid var(--em-gold-400); outline-offset:6px; }
  .spinner{ width:72px; height:72px; }
  .etat-rond{ position:relative; width:96px; height:96px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
  .etat-rond svg{ width:48px; height:48px; position:relative; z-index:1; }
  .etat-ok{ background:var(--em-green-500); }
  .etat-hors{ background:var(--em-terracotta-600); animation:apparait 200ms linear both; }
  .etat-verif{ background:var(--em-gold-400); animation:apparait 200ms linear both; }
  @keyframes apparait{ from{ opacity:0; } to{ opacity:1; } }
  .coche{ stroke-dasharray:40; stroke-dashoffset:40; animation:em-draw 420ms var(--em-ease-out) 240ms forwards; }
  .onde{ position:absolute; inset:0; border-radius:50%; border:3px solid var(--em-green-500); animation:em-ring 1.1s var(--em-ease-out) both; }
  .heure{ font-size:var(--em-fs-26); font-weight:900; font-variant-numeric:tabular-nums; }
  .detail{ font-size:var(--em-fs-13); color:var(--em-text-muted); line-height:1.5; }
  .erreur{ background:var(--em-terracotta-100); color:var(--em-terracotta-800); border-radius:var(--em-radius-md); padding:16px; font-size:var(--em-fs-14); font-weight:700; line-height:1.5; }
  .hint{ font-size:var(--em-fs-12); color:var(--em-text-muted); line-height:1.5; }
  .btn-texte{ background:none; border:1px solid var(--em-border); color:var(--em-text); border-radius:14px; min-height:44px; padding:0 18px; font:800 var(--em-fs-14) var(--em-font); cursor:pointer; }
  @media (prefers-reduced-motion: reduce){ .coche{ stroke-dashoffset:0; } .rond::before{ animation:none; } }
</style>
</head>
<body>

<main class="carte" id="racine" aria-live="polite">
  <div class="marque"><span class="marque-logo" aria-hidden="true">E</span><span class="marque-txt">EcoMaZ · Pointage</span></div>
  <h1>Pointage EcoMaZ</h1>
  <p class="sub">Chargement…</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const token = new URLSearchParams(location.search).get('token');
const racine = document.getElementById('racine');

function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
const MARQUE = `<div class="marque"><span class="marque-logo" aria-hidden="true">E</span><span class="marque-txt">EcoMaZ · Pointage</span></div>`;
const ICONE_PIN = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>`;
const SPINNER = `<svg class="spinner em-spin" viewBox="0 0 72 72" aria-hidden="true"><circle cx="36" cy="36" r="30" fill="none" stroke="var(--em-border)" stroke-width="6"/><path d="M36 6a30 30 0 0 1 30 30" fill="none" stroke="var(--em-green-700)" stroke-width="6" stroke-linecap="round"/></svg>`;

if(!token){
  racine.innerHTML = `${MARQUE}
    <h1>Lien incomplet</h1>
    <div class="erreur" role="alert">Ce lien doit être ouvert tel qu'il a été envoyé par SMS, sans le modifier.</div>`;
} else {
  ecranAccueil();
}
function ecranAccueil(){
  racine.innerHTML = `${MARQUE}
    <h1>Valider ma présence</h1>
    <p class="sub">Touchez le bouton, puis autorisez la localisation quand votre téléphone le demande.</p>
    <button class="rond em-press" id="btnValider" onclick="valider()">${ICONE_PIN}<span>Valider ma présence</span></button>
    <div class="hint">Votre position n'est utilisée que pour ce pointage — elle n'est jamais partagée ailleurs.</div>`;
}
function ecranAttente(texte){
  racine.innerHTML = `${MARQUE}${SPINNER}<h1>${escapeHtml(texte)}</h1><p class="sub">Gardez cette page ouverte quelques secondes.</p>`;
}

function valider(){
  if(!navigator.geolocation){
    afficherErreur("Votre navigateur ne permet pas la localisation. Essayez avec un autre téléphone ou navigateur.");
    return;
  }
  ecranAttente('Localisation en cours…');
  navigator.geolocation.getCurrentPosition(
    async (pos) => {
      ecranAttente('Validation en cours…');
      try{
        const { data, error } = await sb.functions.invoke('valider-pointage-gps', {
          body: {
            token,
            latitude: pos.coords.latitude,
            longitude: pos.coords.longitude,
            precision: pos.coords.accuracy,
          },
        });
        if(error){
          let msg = error.message;
          try{ const corps = await error.context.json(); if(corps?.error) msg = corps.error; }catch(_e){}
          throw new Error(msg);
        }
        if(!data?.ok) throw new Error(data?.error || 'Échec de la validation');
        afficherResultat(data);
      }catch(e){ afficherErreur(e.message); }
    },
    (err) => {
      let msg = "Impossible d'obtenir votre position.";
      if(err.code === err.PERMISSION_DENIED) msg = "Vous avez refusé la localisation — le pointage ne peut pas être validé sans elle. Réessayez et autorisez l'accès à votre position.";
      afficherErreur(msg);
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );
}

function afficherResultat(data){
  const d = new Date();
  const heure = `${String(d.getHours()).padStart(2,'0')}h${String(d.getMinutes()).padStart(2,'0')}`;
  const distance = `Distance : ${data.distanceMetres} m de l'établissement.`;
  if(data.statut === 'dans_etablissement'){
    racine.innerHTML = `${MARQUE}
      <div class="etat-rond etat-ok em-pop"><span class="onde" aria-hidden="true"></span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path class="coche" d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <h1>Présence validée</h1>
      <div class="heure">${heure}</div>
      <p class="sub">Vous êtes bien dans l'établissement. Bonne journée !</p>
      <div class="detail">${escapeHtml(data.nomEcole || '')} · ${distance}</div>
      <div class="hint">Vous pouvez fermer cette page.</div>`;
    if(navigator.vibrate) try{ navigator.vibrate(30); }catch(_e){}
    return;
  }
  // Hors zone ou signal imprécis : ton factuel, aucune animation ludique
  const hors = data.statut === 'hors_etablissement';
  racine.innerHTML = `${MARQUE}
    <div class="etat-rond ${hors ? 'etat-hors' : 'etat-verif'}">
      <svg viewBox="0 0 24 24" fill="none" stroke="${hors ? '#fff' : 'var(--em-green-900)'}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${hors
        ? '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>'
        : '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.34-4.34"/>'}</svg></div>
    <h1>${hors ? "Vous semblez hors de l'établissement" : 'À vérifier'}</h1>
    <p class="sub">${hors
      ? "Votre position est en dehors de la zone attendue. La direction a été informée."
      : "Le signal GPS n'était pas assez précis pour valider automatiquement. La direction vérifiera manuellement."}</p>
    <div class="detail">${escapeHtml(data.nomEcole || '')} · ${distance} · ${heure}</div>
    <div class="hint">Vous pouvez fermer cette page.</div>`;
}
function afficherErreur(message){
  racine.innerHTML = `${MARQUE}
    <h1>Pointage EcoMaZ</h1>
    <div class="erreur" role="alert">${escapeHtml(message)}</div>
    ${token ? '<button class="btn-texte em-press" onclick="ecranAccueil()">Réessayer</button>' : ''}`;
}
</script>
</body>
</html>
