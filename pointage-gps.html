<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pointage — EcoMaZ</title>
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ecomaz-tokens.css">
<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
<style>
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg); color:var(--text); font-family:var(--font-body);
    display:flex; align-items:center; justify-content:center; padding:20px; min-height:100%;
  }
  .carte{ background:var(--surface); border-radius:var(--r-lg); box-shadow:var(--shadow-3); padding:32px 26px; max-width:420px; width:100%; text-align:center; }
  .logo{ font-size:42px; margin-bottom:8px; }
  h1{ font-family:var(--font-title); font-size:var(--fs-lg); margin:0 0 6px; }
  .sub{ color:var(--text-dim); font-size:14px; margin-bottom:22px; }
  .btn{ background:var(--primary); color:var(--on-primary); border:none; border-radius:var(--r-card); padding:16px 20px; min-height:var(--tap); font-size:16px; font-weight:700; cursor:pointer; width:100%; }
  .btn:disabled{ opacity:.6; cursor:default; }
  .btn:hover:not(:disabled){ background:var(--primary-hover); }
  .resultat{ border-radius:var(--r-card); padding:20px; margin-top:10px; }
  .resultat.ok{ background:var(--green-bg); color:var(--success); }
  .resultat.hors{ background:var(--red-bg); color:var(--danger); }
  .resultat.verif{ background:var(--amber-bg); color:var(--warning); }
  .resultat .titre{ font-size:17px; font-weight:800; margin-bottom:6px; }
  .resultat .detail{ font-size:13px; line-height:1.5; }
  .erreur{ background:var(--red-bg); color:var(--danger); border-radius:var(--r-card); padding:18px; font-size:14px; }
  .hint{ font-size:12px; color:var(--text-dim); margin-top:16px; line-height:1.5; }
</style>
</head>
<body>

<div class="carte" id="racine">
  <div class="logo">🎓</div>
  <h1>Pointage EcoMaZ</h1>
  <div class="sub">Chargement…</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const token = new URLSearchParams(location.search).get('token');
const racine = document.getElementById('racine');

function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

if(!token){
  racine.innerHTML = `
    <div class="logo">🎓</div>
    <h1>Lien incomplet</h1>
    <div class="erreur">Ce lien doit être ouvert tel qu'il a été envoyé par SMS, sans le modifier.</div>`;
} else {
  racine.innerHTML = `
    <div class="logo">📍</div>
    <h1>Valider ma présence</h1>
    <div class="sub">Cliquez sur le bouton ci-dessous, puis autorisez la localisation quand votre téléphone le demande.</div>
    <button class="btn" id="btnValider" onclick="valider()">📍 Valider ma présence</button>
    <div class="hint">Votre position n'est utilisée que pour ce pointage — elle n'est jamais partagée ailleurs.</div>
  `;
}

function valider(){
  const btn = document.getElementById('btnValider');
  btn.disabled = true; btn.textContent = 'Localisation en cours…';
  if(!navigator.geolocation){
    afficherErreur("Votre navigateur ne permet pas la localisation. Essayez avec un autre téléphone ou navigateur.");
    return;
  }
  navigator.geolocation.getCurrentPosition(
    async (pos) => {
      btn.textContent = 'Validation en cours…';
      try{
        const { data, error } = await sb.functions.invoke('valider-pointage-gps', {
          body: {
            token,
            latitude: pos.coords.latitude,
            longitude: pos.coords.longitude,
            precision: pos.coords.accuracy,
          },
        });
        if(error){
          let msg = error.message;
          try{ const corps = await error.context.json(); if(corps?.error) msg = corps.error; }catch(_e){}
          throw new Error(msg);
        }
        if(!data?.ok) throw new Error(data?.error || 'Échec de la validation');
        afficherResultat(data);
      }catch(e){ afficherErreur(e.message); }
    },
    (err) => {
      let msg = "Impossible d'obtenir votre position.";
      if(err.code === err.PERMISSION_DENIED) msg = "Vous avez refusé la localisation — le pointage ne peut pas être validé sans elle. Réessayez et autorisez l'accès à votre position.";
      afficherErreur(msg);
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );
}

function afficherResultat(data){
  const infos = {
    dans_etablissement: { classe:'ok', titre: '✅ Présence validée', texte: "Vous êtes bien dans l'établissement." },
    hors_etablissement: { classe:'hors', titre: '⚠️ Hors de l\'établissement', texte: "Votre position est en dehors de la zone attendue. La direction a été informée." },
    a_verifier: { classe:'verif', titre: '🔍 À vérifier', texte: "Le signal GPS n'était pas assez précis pour valider automatiquement. La direction vérifiera manuellement." },
  };
  const info = infos[data.statut] || infos.a_verifier;
  racine.innerHTML = `
    <div class="logo">${data.statut==='dans_etablissement'?'✅':data.statut==='hors_etablissement'?'⚠️':'🔍'}</div>
    <h1>${escapeHtml(data.nomEcole || 'EcoMaZ')}</h1>
    <div class="resultat ${info.classe}">
      <div class="titre">${info.titre}</div>
      <div class="detail">${info.texte}<br>Distance : ${data.distanceMetres} m de l'établissement.</div>
    </div>
    <div class="hint">Vous pouvez fermer cette page.</div>
  `;
}
function afficherErreur(message){
  racine.innerHTML = `
    <div class="logo">🎓</div>
    <h1>Pointage EcoMaZ</h1>
    <div class="erreur">${escapeHtml(message)}</div>
  `;
}
</script>
</body>
</html>
